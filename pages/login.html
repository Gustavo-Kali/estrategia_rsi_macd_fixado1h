<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso — Automação Inteligente com IA</title>
    <link rel="stylesheet" href="/css/global.css">
    <style>
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(126, 34, 206, 0.28) 0%, transparent 55%),
                radial-gradient(circle at 80% 80%, rgba(56, 189, 248, 0.15) 0%, transparent 50%);
        }
        .ambient-glow {
            position: fixed; border-radius: 50%;
            pointer-events: none; filter: blur(90px); z-index: 0;
        }
        .glow-1 { width:450px; height:450px; top:-140px; left:5%; background: radial-gradient(circle, rgba(126,34,206,0.55) 0%, transparent 70%); }
        .glow-2 { width:380px; height:380px; bottom:-100px; right:5%; background: radial-gradient(circle, rgba(29,78,216,0.45) 0%, transparent 70%); }

        .login-card {
            position: relative; z-index: 10;
            background: rgba(13, 8, 28, 0.88);
            border: 1px solid rgba(168, 85, 247, 0.22);
            border-radius: 24px;
            padding: 52px 48px 44px;
            width: 100%; max-width: 400px;
            box-shadow: 0 0 80px rgba(126, 34, 206, 0.15), 0 24px 64px rgba(0,0,0,0.6);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            text-align: center;
        }

        .logo-icon {
            width: 60px; height: 60px; margin: 0 auto 20px;
            background: linear-gradient(135deg, #c084fc 0%, #7e22ce 100%);
            color: #fff; border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 1.4rem;
            box-shadow: 0 0 32px rgba(192, 132, 252, 0.45);
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 1.55rem; font-weight: 800;
            color: #fff; margin-bottom: 8px;
        }
        .card-subtitle {
            font-size: 0.9rem; color: var(--text-muted);
            margin-bottom: 36px; line-height: 1.5;
        }

        /* Botão Google */
        .btn-google {
            width: 100%; padding: 14px 20px;
            background: #fff; border: none;
            border-radius: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 12px;
            font-size: 0.98rem; font-weight: 600; color: #1a1a2e;
            transition: box-shadow 0.2s, transform 0.1s, opacity 0.2s;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .btn-google:hover { box-shadow: 0 6px 28px rgba(0,0,0,0.45); opacity: 0.95; }
        .btn-google:active { transform: scale(0.98); }
        .btn-google:disabled { opacity: 0.55; cursor: not-allowed; }
        .btn-google svg { flex-shrink: 0; }

        .divider {
            display: flex; align-items: center; gap: 12px;
            margin: 24px 0; color: rgba(255,255,255,0.2); font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px;
            background: rgba(255,255,255,0.08);
        }

        /* Seção email/senha (colapsada por padrão) */
        .email-section { display: none; }
        .email-section.open { display: block; }

        .toggle-email {
            background: none; border: none;
            color: rgba(168, 85, 247, 0.7);
            font-size: 0.82rem; cursor: pointer;
            text-decoration: underline; margin-top: 2px;
            transition: color 0.2s;
        }
        .toggle-email:hover { color: #c084fc; }

        /* Tab login/register dentro da seção email */
        .tab-switch {
            display: flex; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
            padding: 3px; margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1; padding: 8px; background: none; border: none;
            color: var(--text-muted); font-weight: 600; font-size: 0.85rem;
            cursor: pointer; border-radius: 7px; transition: all 0.2s;
        }
        .tab-btn.active { background: rgba(168,85,247,0.2); color: #c084fc; }

        .form-group { margin-bottom: 14px; text-align: left; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 10px 13px; box-sizing: border-box;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 9px;
            color: #fff; font-size: 0.93rem; font-family: var(--font-body);
            outline: none; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus { border-color: rgba(168,85,247,0.5); box-shadow: 0 0 0 3px rgba(168,85,247,0.12); }
        .form-group input::placeholder { color: rgba(255,255,255,0.2); }

        .btn-submit {
            width: 100%; padding: 12px; margin-top: 4px;
            background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
            border: none; border-radius: 10px; color: #fff;
            font-weight: 700; font-size: 0.95rem; cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 20px rgba(126,34,206,0.4);
        }
        .btn-submit:hover { opacity: 0.9; }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { opacity: 0.55; cursor: not-allowed; }

        .forgot-link {
            display: block; text-align: right; font-size: 0.78rem;
            color: var(--text-muted); text-decoration: none;
            margin-top: 3px; margin-bottom: 12px; transition: color 0.2s;
        }
        .forgot-link:hover { color: #c084fc; }

        .msg-error, .msg-success {
            padding: 10px 13px; border-radius: 9px;
            font-size: 0.85rem; font-weight: 600; margin-bottom: 14px; display: none;
            text-align: left;
        }
        .msg-error { background: rgba(246,70,93,0.12); border: 1px solid rgba(246,70,93,0.3); color: #f6465d; }
        .msg-success { background: rgba(14,203,129,0.12); border: 1px solid rgba(14,203,129,0.3); color: #0ecb81; }

        .back-link {
            display: block; text-align: center; color: rgba(255,255,255,0.25);
            font-size: 0.8rem; text-decoration: none; margin-top: 24px;
            transition: color 0.2s;
        }
        .back-link:hover { color: #c084fc; }

        .spinner {
            display: inline-block; width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
            border-radius: 50%; animation: spin 0.7s linear infinite;
            vertical-align: middle; margin-right: 6px;
        }
        .spinner-dark {
            display: inline-block; width: 16px; height: 16px;
            border: 2px solid rgba(0,0,0,0.15); border-top-color: #333;
            border-radius: 50%; animation: spin 0.7s linear infinite;
            vertical-align: middle; margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="login-card">
        <div class="logo-icon">IA</div>
        <div class="card-title">Bem-vindo de volta</div>
        <div class="card-subtitle">Faça login para acessar<br>o painel de controle dos bots</div>

        <!-- Mensagens globais -->
        <div class="msg-error" id="msg-error"></div>
        <div class="msg-success" id="msg-success"></div>

        <!-- Botão Google (principal) -->
        <button class="btn-google" id="btn-google" onclick="handleGoogle()">
            <svg width="20" height="20" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Entrar com Google
        </button>

        <!-- Opção de email/senha (secundária, colapsada) -->
        <div class="divider">ou</div>
        <button class="toggle-email" onclick="toggleEmail()">Entrar com e-mail e senha</button>

        <div class="email-section" id="email-section">
            <div style="height:20px"></div>
            <div class="tab-switch">
                <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Entrar</button>
                <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Criar Conta</button>
            </div>

            <!-- Form Login Email -->
            <div id="form-login">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="login-email" placeholder="seu@email.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
                </div>
                <a href="#" class="forgot-link" onclick="handleForgot(event)">Esqueceu a senha?</a>
                <button class="btn-submit" id="btn-login" onclick="handleLogin()">Entrar</button>
            </div>

            <!-- Form Cadastro Email -->
            <div id="form-register" style="display:none">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="reg-email" placeholder="seu@email.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>Confirmar Senha</label>
                    <input type="password" id="reg-confirm" placeholder="Repita a senha" autocomplete="new-password">
                </div>
                <button class="btn-submit" id="btn-register" onclick="handleRegister()">Criar Conta</button>
            </div>
        </div>

        <a href="/" class="back-link">← Voltar para o painel</a>
    </div>

    <script type="module">
        import { FirebaseSync } from '/js/firebase_sync.js';
        window.FS = FirebaseSync;
        // Se já logado, redireciona
        FirebaseSync.onAuthStateChanged((user) => {
            if (user) {
                const redirect = new URLSearchParams(window.location.search).get('redirect') || '/';
                window.location.href = redirect;
            }
        });
    </script>

    <script>
        // ── Google ────────────────────────────────────────────────────
        async function handleGoogle() {
            clearMessages();
            const btn = document.getElementById('btn-google');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-dark"></span>Aguarde...';
            try {
                await window.FS.loginWithGoogle();
                // onAuthStateChanged fará o redirect automaticamente
            } catch (e) {
                btn.disabled = false;
                btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Entrar com Google`;
                if (e.code !== 'auth/popup-closed-by-user') {
                    showError(`Erro Google (${e.code}): ${e.message}`);
                }
            }
        }

        // ── Toggle email/senha ─────────────────────────────────────────
        function toggleEmail() {
            const el = document.getElementById('email-section');
            el.classList.toggle('open');
        }

        // ── Abas Login / Cadastro ──────────────────────────────────────
        function switchTab(tab) {
            const isLogin = tab === 'login';
            document.getElementById('tab-login').classList.toggle('active', isLogin);
            document.getElementById('tab-register').classList.toggle('active', !isLogin);
            document.getElementById('form-login').style.display = isLogin ? 'block' : 'none';
            document.getElementById('form-register').style.display = isLogin ? 'none' : 'block';
            clearMessages();
        }

        // ── Mensagens ──────────────────────────────────────────────────
        function showError(msg) {
            const el = document.getElementById('msg-error');
            el.textContent = msg; el.style.display = 'block';
            document.getElementById('msg-success').style.display = 'none';
        }
        function showSuccess(msg) {
            const el = document.getElementById('msg-success');
            el.textContent = msg; el.style.display = 'block';
            document.getElementById('msg-error').style.display = 'none';
        }
        function clearMessages() {
            document.getElementById('msg-error').style.display = 'none';
            document.getElementById('msg-success').style.display = 'none';
        }

        function setLoading(btnId, loading, label) {
            const btn = document.getElementById(btnId);
            btn.disabled = loading;
            btn.innerHTML = loading ? '<span class="spinner"></span>Aguarde...' : label;
        }

        // ── Login e-mail ───────────────────────────────────────────────
        async function handleLogin() {
            clearMessages();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            if (!email || !password) { showError('Preencha e-mail e senha.'); return; }
            setLoading('btn-login', true, 'Entrar');
            try {
                await window.FS.login(email, password);
            } catch (e) {
                setLoading('btn-login', false, 'Entrar');
                const msgs = {
                    'auth/user-not-found': 'E-mail não encontrado.',
                    'auth/wrong-password': 'Senha incorreta.',
                    'auth/invalid-email': 'E-mail inválido.',
                    'auth/too-many-requests': 'Muitas tentativas. Aguarde alguns minutos.',
                    'auth/invalid-credential': 'E-mail ou senha incorretos.'
                };
                showError(msgs[e.code] || 'Erro ao fazer login.');
            }
        }

        // ── Cadastro e-mail ────────────────────────────────────────────
        async function handleRegister() {
            clearMessages();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm').value;
            if (!email || !password) { showError('Preencha todos os campos.'); return; }
            if (password !== confirm) { showError('As senhas não coincidem.'); return; }
            if (password.length < 6) { showError('A senha deve ter pelo menos 6 caracteres.'); return; }
            setLoading('btn-register', true, 'Criar Conta');
            try {
                await window.FS.register(email, password);
            } catch (e) {
                setLoading('btn-register', false, 'Criar Conta');
                const msgs = {
                    'auth/email-already-in-use': 'Este e-mail já está cadastrado.',
                    'auth/invalid-email': 'E-mail inválido.',
                    'auth/weak-password': 'Senha muito fraca.'
                };
                showError(msgs[e.code] || 'Erro ao criar conta.');
            }
        }

        // ── Recuperar senha ────────────────────────────────────────────
        async function handleForgot(e) {
            e.preventDefault(); clearMessages();
            const email = document.getElementById('login-email').value.trim();
            if (!email) { showError('Digite seu e-mail acima para recuperar a senha.'); return; }
            try {
                await window.FS.resetPassword(email);
                showSuccess('E-mail de recuperação enviado! Verifique sua caixa de entrada.');
            } catch (err) {
                showError('Não foi possível enviar o e-mail de recuperação.');
            }
        }

        // Enter para submeter form de e-mail
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter') return;
            const section = document.getElementById('email-section');
            if (!section.classList.contains('open')) return;
            const isLogin = document.getElementById('form-login').style.display !== 'none';
            if (isLogin) handleLogin(); else handleRegister();
        });
    </script>
</body>
</html>
